<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indian Bike Driving 3D</title><style>body{margin:0;background:#222;color:white;font-family:Arial;text-align:center;overflow:hidden}canvas{display:block}#ui{position:absolute;top:5px;width:100%;pointer-events:none}button{pointer-events:auto;padding:12px;margin:4px;border:0;border-radius:8px;background:#ff9800;color:white;font-weight:bold}#msg{font-size:20px;font-weight:bold}</style></head><body><div id="ui"><h2>🏍️ Indian Bike Driving 3D</h2><p>Use A/D or ← → to steer</p><button onclick="start()">START</button><button onclick="speed=Math.min(speed+1,15)">ACCELERATE</button><button onclick="speed=0">BRAKE</button><p id="score">Score: 0 | Speed: 0</p><p id="msg">Press START to play</p></div><canvas id="game"></canvas><script>const c=document.getElementById('game'),x=c.getContext('2d');let w,h,bike=0,speed=0,score=0,keys={},blocks=[],running=false,road=0;function resize(){c.width=w=innerWidth;c.height=h=innerHeight}onresize=resize;resize();function start(){running=true;speed=5;document.getElementById('msg').textContent='Collect the red blocks!';if(!blocks.length)for(let i=0;i<5;i++)blocks.push({p:Math.random()*.7,l:Math.random()*.8-.4,hit:false})}onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;function draw(){x.clearRect(0,0,w,h);x.fillStyle='#78c8f0';x.fillRect(0,0,w,h);x.fillStyle='#39833c';x.fillRect(0,h*.35,w,h*.65);x.fillStyle='#555';x.beginPath();x.moveTo(w*.35,h*.35);x.lineTo(w*.65,h*.35);x.lineTo(w*1.15,h);x.lineTo(-w*.15,h);x.fill();x.strokeStyle='white';x.lineWidth=5;x.setLineDash([35,30]);x.lineDashOffset=-road;x.beginPath();x.moveTo(w/2,h*.35);x.lineTo(w/2,h);x.stroke();x.setLineDash([]);if(running){if(keys.arrowleft||keys.a)bike-=4;if(keys.arrowright||keys.d)bike+=4;bike=Math.max(-w*.3,Math.min(w*.3,bike));road+=speed*.8;if(Math.random()<.018)blocks.push({p:0,l:Math.random()*.8-.4,hit:false});blocks.forEach(a=>{a.p+=speed*.0018;let bx=w/2+a.l*a.p*w*.8,by=h*.38+a.p*h*.6,size=12+a.p*28;if(!a.hit){x.fillStyle='red';x.fillRect(bx-size/2,by-size/2,size,size);if(a.p>.78&&Math.abs(bx-(w/2+bike))<size+25){a.hit=true;score++;document.getElementById('msg').textContent='🎉 Red block collected! +1 score'}}});blocks=blocks.filter(a=>a.p<1.1&&!a.hit);if(blocks.length<3)for(let i=0;i<3;i++)blocks.push({p:Math.random()*.2,l:Math.random()*.8-.4,hit:false})}x.save();x.translate(w/2+bike,h*.78);x.fillStyle='#111';x.beginPath();x.arc(-15,25,13,0,7);x.arc(15,25,13,0,7);x.fill();x.fillStyle='#ff5722';x.fillRect(-22,-12,44,32);x.fillStyle='#222';x.fillRect(-8,-35,16,28);x.fillStyle='#ddd';x.fillRect(-25,-18,50,5);x.fillStyle='#ffeb3b';x.fillRect(-7,-15,14,8);x.restore();document.getElementById('score').textContent='Score: '+score+' | Speed: '+speed;requestAnimationFrame(draw)}draw();</script></body></html>
